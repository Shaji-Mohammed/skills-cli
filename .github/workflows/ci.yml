name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest -q
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Stage 1 recall on dev (deterministic, no LLM)
        env:
          FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
        run: uv run router eval stage1-check
