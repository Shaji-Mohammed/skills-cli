[project]
name = "skill-router"
version = "0.1.0"
description = "Route a natural-language prompt to every skill it needs from a curated corpus."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.9.0",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "typer>=0.12",
]

[project.scripts]
router = "router.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["router", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
